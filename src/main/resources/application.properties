spring.application.name=vinsight-api
server.port=8080

# Perfil padrao: dev. Sobrescreva com SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === JPA / Hibernate (comum aos perfis) ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# === Jackson (Jackson 3.x - datas ja sao ISO-8601 por default) ===
spring.jackson.time-zone=America/Sao_Paulo

# === SpringDoc / Swagger ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# === Actuator: apenas o health check publico exigido pelo contrato ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# === Seguranca (US-29) ===
api.security.token.secret=${JWT_SECRET:vinsight-ford-challenge-2026-secret}
api.security.token.access-expiration-minutes=15
api.security.token.refresh-expiration-hours=8
