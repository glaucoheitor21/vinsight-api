# === Perfil DEV - MySQL local ===
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vinsight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:fiap}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Em dev o Flyway aplica tambem a massa de demonstracao (db/seed)
spring.flyway.locations=classpath:db/migration,classpath:db/seed
# Migrations novas (V13+) tem numero MENOR que o seed V900 ja aplicado. Sem isto, o Flyway recusa
# aplica-las num banco de dev existente ("Detected resolved migration not applied to database").
# Regra que isto impoe: o seed e as correcoes dele (V9xx) precisam ser compativeis com o schema final.
spring.flyway.out-of-order=true
