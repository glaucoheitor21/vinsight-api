# === Perfil PROD - tudo por variavel de ambiente, nada de credencial no repositorio ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Sem massa de demonstracao. ignore-migration-patterns evita falha caso o banco
# tenha sido usado antes em dev e carregue o seed (V900) no historico do Flyway.
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing
